name: Build AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Manifest sozlamalari (mikrofon, zaxira o'chirilgan)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><application|' $M
          sed -i 's|android:allowBackup="true"|android:allowBackup="false"|' $M
          grep -n "RECORD_AUDIO\|allowBackup" $M
      - name: Ikonka va ochilish ekrani
        run: |
          pip install --break-system-packages pillow -q
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os
          res = 'android/app/src/main/res'
          full = Image.open('icon/icon-1024.png').convert('RGBA')
          fg = Image.open('icon/icon-foreground-1024.png').convert('RGBA')
          for k, s in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              p = f'{res}/mipmap-{k}'
              sq = full.resize((s, s), Image.LANCZOS)
              m = Image.new('L', (s, s), 0)
              ImageDraw.Draw(m).rounded_rectangle([0, 0, s - 1, s - 1], radius=int(s * .2), fill=255)
              a = Image.new('RGBA', (s, s), (0, 0, 0, 0)); a.paste(sq, (0, 0), m); a.save(p + '/ic_launcher.png')
              m = Image.new('L', (s, s), 0)
              ImageDraw.Draw(m).ellipse([0, 0, s - 1, s - 1], fill=255)
              b = Image.new('RGBA', (s, s), (0, 0, 0, 0)); b.paste(sq, (0, 0), m); b.save(p + '/ic_launcher_round.png')
              f = int(s * 108 / 48)
              fg.resize((f, f), Image.LANCZOS).save(p + '/ic_launcher_foreground.png')
          open(res + '/values/ic_launcher_background.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#7C4DFF</color>\n</resources>\n')
          sp = Image.new('RGB', (16, 16), (124, 77, 255))
          for r, _, fs in os.walk(res):
              for n in fs:
                  if n == 'splash.png':
                      sp.save(os.path.join(r, n))
          PY
      - name: Imzo kaliti va versiya
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.keystore
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          cat >> android/app/build.gradle <<'EOF2'
          android {
              signingConfigs {
                  upload {
                      storeFile file("upload.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.upload
                  }
              }
          }
          EOF2
      - name: AAB va APK yig'ish
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: cd android && chmod +x gradlew && ./gradlew bundleRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: organamiz-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: organamiz-apk
          path: android/app/build/outputs/apk/release/app-release.apk
